name: Macro ingestion

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch ten years instead of the rolling daily window
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "43 2 * * *"

concurrency:
  group: macro-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install --no-interaction --no-root
      - name: Apply migrations using direct Neon connection
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: poetry run alembic -c finpipeline/alembic.ini upgrade head
      - name: Run idempotent macro job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: PYTHONPATH=finpipeline poetry run python -m src.jobs run macro ${{ inputs.backfill && '--backfill' || '' }}
      - name: Refresh no-lookahead regime fingerprints
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=finpipeline poetry run python -m src.jobs run regime
