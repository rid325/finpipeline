name: News ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install --no-interaction --no-root
      - name: Apply migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: poetry run alembic -c finpipeline/alembic.ini upgrade head
      - name: Run licensed-opt-in feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_FEEDS_ENABLED: ${{ vars.NEWS_FEEDS_ENABLED }}
        run: PYTHONPATH=finpipeline poetry run python -m src.jobs run news
