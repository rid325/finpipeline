services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finpipeline
      POSTGRES_USER: finpipeline
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpipeline -d finpipeline"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - finpipeline-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: finpipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://finpipeline:local-development-only@postgres:5432/finpipeline
      MIGRATION_DATABASE_URL: postgresql://finpipeline:local-development-only@postgres:5432/finpipeline
      SECRET_KEY: local-development-secret-not-for-production
      ENABLE_APSCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  finpipeline-postgres:
