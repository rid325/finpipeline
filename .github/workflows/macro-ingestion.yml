name: Macro ingestion

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch ten years instead of the rolling daily window
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "43 2 * * *"

concurrency:
  group: macro-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check database configuration
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ingestion paused::Add DATABASE_URL and MIGRATION_DATABASE_URL repository secrets before enabling scheduled ingestion."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.database.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.database.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.database.outputs.ready == 'true'
        run: pipx install poetry
      - if: steps.database.outputs.ready == 'true'
        run: poetry install --no-interaction --no-root
      - name: Apply migrations using direct Neon connection
        if: steps.database.outputs.ready == 'true'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: poetry run alembic -c finpipeline/alembic.ini upgrade head
      - name: Run idempotent macro job
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: PYTHONPATH=finpipeline poetry run python -m src.jobs run macro ${{ inputs.backfill && '--backfill' || '' }}
      - name: Refresh no-lookahead regime fingerprints
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=finpipeline poetry run python -m src.jobs run regime
